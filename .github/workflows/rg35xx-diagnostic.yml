
name: RG35XX Toolchain Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Check ARM toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Download candidate toolchain image
        run: docker pull miyoocfw/toolchain-shared-uclibc:latest

      - name: Inspect compiler and build test binary
        shell: bash
        run: |
          set -o pipefail

          docker run --rm \
            --entrypoint /bin/sh \
            miyoocfw/toolchain-shared-uclibc:latest \
            -c '
              set -eu

              CC=arm-miyoo-linux-uclibcgnueabi-gcc
              CXX=arm-miyoo-linux-uclibcgnueabi-g++

              echo "=== C COMPILER ==="
              command -v "$CC"
              "$CC" -dumpmachine

              echo "=== C++ COMPILER ==="
              command -v "$CXX"
              "$CXX" -dumpmachine
              "$CXX" -v 2>&1

              echo "=== BUILD C TEST ==="
              printf "int main(void) { return 0; }\n" > /tmp/test.c
              "$CC" /tmp/test.c -o /tmp/test-arm

              echo "=== BUILD C++ SHARED LIBRARY ==="
              cat > /tmp/test.cpp <<'EOF'
              #include <string>

              extern "C" int fake08_test() {
                  std::string s("RG35XX");
                  return static_cast<int>(s.size());
              }
              EOF

              "$CXX" -shared -fPIC -shared-libgcc \
                /tmp/test.cpp -o /tmp/test-cpp.so

              echo "=== C++ LIBRARY DEPENDENCIES ==="
              readelf -h -A -d -V /tmp/test-cpp.so

              echo "=== C++ TEST COMPLETED ==="
            ' 2>&1 | tee rg35xx-diagnostic.txt

      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RG35XX-Diagnostic
          path: rg35xx-diagnostic.txt
          if-no-files-found: warn
